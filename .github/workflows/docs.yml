name: docs

#  Build the documentation, keep the HTML as the workflow artifact docs-html
#  and signal spm1d.org so that the site fetches the new build (needs the
#  secret SITE_DISPATCH_TOKEN;  without it that step is skipped).
#
#  Runs as the last step of a release (publish.yml calls it), or by hand for a
#  docs-only fix (Actions -> docs -> Run workflow), which is refused on any
#  branch other than master.

on:
  workflow_call:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Refuse a manual run on a branch other than master
      if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
      run: |
        echo "::error::docs can only be run by hand on master, not on $GITHUB_REF_NAME"
        exit 1
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install LaTeX and pandoc
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-base texlive-latex-extra dvipng pandoc
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sphinx sphinx_bootstrap_theme nbsphinx ipython .
    - name: Build
      run: |
        cd doc
        python -m sphinx -E -a -b html source build/html
      env:
        MPLBACKEND: Agg
    - name: Upload the HTML
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: doc/build/html
    - name: Notify the site
      env:
        TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
      run: |
        if [ -z "$TOKEN" ]; then echo "no SITE_DISPATCH_TOKEN; skipped"; exit 0; fi
        curl -sS --fail-with-body -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/spm1d-org/spm1d.org/dispatches \
          -d "{\"event_type\": \"docs-updated\", \"client_payload\": {\"child\": \"spm1d-v0.4\", \"run_id\": \"$GITHUB_RUN_ID\"}}"
